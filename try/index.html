<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>喵吉曆 — 本喵先幫你看今天</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: "Noto Sans TC", "PingFang TC", sans-serif; background: #f4efe5; color: #2b2b2b; min-height: 100vh; display: flex; justify-content: center; }
  .wrap { width: 100%; max-width: 430px; padding: 28px 20px 48px; }
  h1 { font-size: 26px; margin-bottom: 4px; }
  .sub { color: #6b665d; font-size: 14px; margin-bottom: 20px; }
  .card { background: #fffdf8; border: 1px solid #e5dfd2; border-radius: 18px; padding: 18px 16px; margin-bottom: 14px; }
  label { font-size: 13px; font-weight: 700; color: #6b665d; display: block; margin: 10px 0 6px; }
  input, select { width: 100%; padding: 12px; font-size: 16px; border: 1.5px solid #e5dfd2; border-radius: 12px; background: #fff; }
  input::placeholder { color: #b5ad9b; }
  input:focus, select:focus { outline: none; border-color: #c9a227; }
  /* 跟 app「寫日記」同款手繪貼紙鈕:紙底 + 墨線框 + 墨字 + 立體陰影,彩色水晶球當焦點(2026-10-04) */
  button.go { width: 100%; margin-top: 18px; padding: 12px; display: flex; align-items: center; justify-content: center; gap: 8px;
    font: inherit; font-size: 16px; font-weight: 800; color: #352f2a; background: #fffdf8; border: 2px solid #352f2a; border-radius: 999px;
    box-shadow: 0 3px 0 rgba(53, 47, 42, .16), 0 7px 16px rgba(53, 47, 42, .18); cursor: pointer; transition: transform .08s ease, box-shadow .08s ease; }
  button.go:active { transform: scale(.97) translateY(1px); box-shadow: 0 1px 0 rgba(53, 47, 42, .16), 0 4px 10px rgba(53, 47, 42, .16); }
  button.go svg { width: 22px; height: 25px; flex-shrink: 0; }
  .hidden { display: none; }
  .folded { opacity: .55; }
  #err { color: #c0392b; font-size: 13px; margin-top: 8px; }
  .score-row { display: flex; align-items: baseline; gap: 10px; }
  #score { font-size: 56px; font-weight: 800; }
  .level { font-size: 14px; font-weight: 800; color: #fff; padding: 3px 12px; border-radius: 999px; background: #b5ad9b; }
  .level.ji { background: #c0392b; } .level.shen { background: #34495e; }
  #ganzhi { color: #6b665d; font-size: 13px; margin: 6px 0 10px; }
  #quote { font-size: 15px; line-height: 1.7; margin-bottom: 10px; }
  #omen { font-size: 13.5px; color: #8a6a08; line-height: 1.6; margin-bottom: 8px; }
  #lucky { font-size: 13px; font-weight: 700; color: #6e8b5e; }
  .cta { text-align: center; }
  .cta p { font-size: 14px; color: #6b665d; margin-bottom: 12px; line-height: 1.7; }
  .cta a { display: inline-block; padding: 14px 34px; background: #c9a227; color: #fff; font-weight: 800; border-radius: 999px; text-decoration: none; font-size: 16px; }
  .note { font-size: 11.5px; color: #9a9184; margin-top: 10px; text-align: center; line-height: 1.6; }
  .cat { width: 130px; display: block; margin: 0 auto 8px; }
  .site-links { text-align: center; font-size: 12.5px; color: #9a9184; margin-top: 6px; }
  .site-links a { color: #9a9184; }
</style>
  <script type="module" crossorigin src="./assets/index-DeIzIobo.js"></script>
</head>
<body>
  <div class="wrap">
    <img class="cat" src="./cat/cat-crystal.webp" alt="喵大師" onerror="this.style.display='none'" />
    <h1>喵吉曆</h1>
    <p class="sub">每日運勢 × 擇日,陪你過好每一天。先讓本喵免費看你的今天:</p>

    <div class="card" id="form-card">
      <label for="birth">你的生日</label>
      <!-- 直接打數字(命主 2026-09-22:日期選擇器要滑到自己生日太麻煩);邊打邊補斜線 -->
      <input type="text" id="birth" inputmode="numeric" autocomplete="bday" placeholder="1900/01/01" maxlength="10" />
      <label for="gender">性別(排盤用)</label>
      <select id="gender">
        <option value="female">女</option>
        <option value="male">男</option>
        <option value="na">不方便說</option>
      </select>
      <button class="go" id="go"><svg viewBox="12 6 40 46" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="27" r="12" fill="#b9a7de"/><path d="M24 45h16M27 50h10M24 40c5 3 11 3 16 0"/><path d="M32 15v-6M42 19l4-4M22 19l-4-4"/><path d="M27 27c2.5-3.4 7.5-3.4 10 0" stroke="#fff9ed" stroke-width="2.2"/></g></svg>本喵幫你看今天</button>
      <p id="err"></p>
    </div>

    <div class="result-anchor"></div>
    <div class="card hidden" id="result">
      <div class="score-row"><span id="score">--</span><span>分</span><span class="level" id="level">平</span><span id="paws"></span></div>
      <p id="ganzhi"></p>
      <p id="quote"></p>
      <p id="omen"></p>
      <p id="lucky"></p>
    </div>

    <div class="card cta hidden" id="cta">
      <p>這只是通用盤。<br /><b>加上出生時辰</b>,分數、吉時、每天的錦囊全部變成你專屬的——還有一隻記得你大日子的貓。</p>
      <a id="store" href="#">下載喵吉曆 App</a>
      <p class="note">排盤在你的裝置上完成,生日不會被上傳或儲存。</p>
    </div>

    <p class="site-links"><a href="../">喵吉曆官網</a> · <a href="../privacy.html">隱私權政策</a> · <a href="../terms.html">使用條款</a></p>
  </div>
</body>
</html>
